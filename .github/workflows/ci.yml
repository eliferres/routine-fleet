name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Lint the shipped rosters
        run: |
          python fleet.py --roster templates/fleet.json validate
          python fleet.py --roster demo/fleet.json validate
      - name: The generated crontab block matches the template
        run: |
          python fleet.py --roster templates/fleet.json crontab --install-dir /opt/fleet \
            | diff -u templates/crontab.example -
