name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Lint the shipped rosters
        run: |
          python routine_fleet.py --roster templates/fleet.json validate
          python routine_fleet.py --roster demo/fleet.json validate
      - name: The generated crontab block matches the template
        run: |
          python routine_fleet.py --roster templates/fleet.json crontab --install-dir /opt/fleet \
            | diff -u templates/crontab.example -
      - name: The installed command runs
        run: |
          python -m pip install .
          routine-fleet --version
          routine-fleet --roster demo/fleet.json validate
