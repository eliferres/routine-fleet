[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "routine-fleet"
dynamic = ["version"]
description = "Keep a fleet of scheduled AI routines honest: twin-run guard, watchdog, and parity check."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Eli Ferres" }]

[project.urls]
Source = "https://github.com/eliferres/routine-fleet"
Changelog = "https://github.com/eliferres/routine-fleet/blob/main/CHANGELOG.md"

[project.scripts]
routine-fleet = "routine_fleet:main"

[tool.setuptools]
py-modules = ["routine_fleet"]

[tool.setuptools.dynamic]
version = { attr = "routine_fleet.__version__" }
